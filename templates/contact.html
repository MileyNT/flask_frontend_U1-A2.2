{% extends "base.html" %}
{% block title %}Contacto - Flask Frontend{% endblock %}
{% block content %}
<h2>Contáctanos</h2>
<form method="post">
<p> {{form.name.label}}<br>{{form.name(size=32) }} </p>
<p> {{form.email.label}}<br>{{form.email(size=32)}}</p>
<p> {{form.message.label}}<br>{{form-message(rows=4, cols=32)}}</p>
<p> {{form.submit()}}</p>
</form>
{% endblock %}
